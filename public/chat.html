<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyJobAI Multilingual Career Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root {
            /* Dark Mode Variables (Default) */
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --chat-bg: #1a1a2e;
            --header-gradient: linear-gradient(45deg, #16213e, #0f3460);
            --message-bg: #16213e;
            --user-message-gradient: linear-gradient(45deg, #4a6cf7, #667eea);
            --bot-message-bg: #2a2a4a;
            --bot-message-border: #3a3a6a;
            --input-bg: #2a2a4a;
            --input-border: #3a3a6a;
            --input-border-focus: #667eea;
            --text-primary: #ffffff;
            --text-secondary: #b8b8d1;
            --text-placeholder: #8a8aa0;
            --button-primary: linear-gradient(45deg, #667eea, #764ba2);
            --button-danger: linear-gradient(45deg, #ff6b6b, #ee5a52);
            --quick-action-bg: rgba(102, 126, 234, 0.1);
            --quick-action-border: rgba(102, 126, 234, 0.3);
            --quick-action-color: #667eea;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --status-online: #4CAF50;
            --status-offline: #ff6b6b;
        }

        [data-theme="light"] {
            /* Light Mode Variables */
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --chat-bg: #ffffff;
            --header-gradient: linear-gradient(45deg, #ffffff, #87CEEB);
            --message-bg: #f8f9fa;
            --user-message-gradient: linear-gradient(45deg, #2196F3, #21CBF3);
            --bot-message-bg: #ffffff;
            --bot-message-border: #e0e0e0;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --input-border-focus: #4CAF50;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-placeholder: #999999;
            --button-primary: linear-gradient(45deg, #4CAF50, #45a049);
            --button-danger: linear-gradient(45deg, #f44336, #d32f2f);
            --quick-action-bg: rgba(76, 175, 80, 0.1);
            --quick-action-border: rgba(76, 175, 80, 0.3);
            --quick-action-color: #4CAF50;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --status-online: #4CAF50;
            --status-offline: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 20px 50px var(--shadow-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .chat-header {
            background: var(--header-gradient);
            color: var(--text-primary);
            padding: 20px;
            text-align: center;
            position: relative;
            transition: background 0.3s ease;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .brand-name {
            background: linear-gradient(45deg, #2C7DFF, #4E3BF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        .header-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .language-selector {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .lang-btn.active {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .status-indicator {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--status-online);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--message-bg);
            transition: background 0.3s ease;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.system {
            justify-content: center;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .message.user .message-content {
            background: var(--user-message-gradient);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-content {
            background: var(--bot-message-bg);
            color: var(--text-primary);
            border: 1px solid var(--bot-message-border);
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message.system .message-content {
            background: rgba(255, 193, 7, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 18px;
            font-style: italic;
            font-size: 14px;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .message.bot .message-time {
            text-align: left;
        }

        .chat-input-container {
            padding: 20px;
            background: var(--input-bg);
            border-top: 1px solid var(--input-border);
            display: flex;
            gap: 12px;
            align-items: center;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .chat-input::placeholder {
            color: var(--text-placeholder);
        }

        .chat-input:focus {
            border-color: var(--input-border-focus);
        }

        .send-btn {
            background: var(--button-primary);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 80px;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            background: var(--button-danger);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--text-secondary);
            font-size: 12px;
            font-style: italic;
        }

        .typing-dots {
            display: flex;
            gap: 2px;
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typingPulse 1.5s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingPulse {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .quick-action-btn {
            background: var(--quick-action-bg);
            border: 1px solid var(--quick-action-border);
            color: var(--quick-action-color);
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .quick-action-btn:hover {
            background: var(--quick-action-border);
            transform: translateY(-1px);
        }

        .language-indicator {
            font-size: 10px;
            opacity: 0.6;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 95vh;
                border-radius: 15px;
            }

            .chat-header h1 {
                font-size: 20px;
            }

            .header-controls {
                position: static;
                margin-top: 10px;
                justify-content: center;
            }

            .status-indicator {
                position: static;
                justify-content: center;
                margin-bottom: 10px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body data-theme="dark">
    <div class="chat-container">
        <div class="chat-header">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="status-text">Online</span>
            </div>
            <div class="header-controls">
                <button class="theme-toggle" id="theme-toggle" title="Theme wechseln">
                    🌙
                </button>
                <div class="language-selector">
                    <button class="lang-btn active" data-lang="de">🇩🇪 DE</button>
                    <button class="lang-btn" data-lang="en">🇺🇸 EN</button>
                </div>
            </div>
            <h1 id="chat-title"><span class="brand-name">EasyJobAI</span> Karriere-Assistent</h1>
            <p id="chat-subtitle">Ihr intelligenter Begleiter für Bewerbungen und Karriereplanung</p>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="typing-indicator" id="typing-indicator">
                <span id="typing-text">Bot schreibt</span>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>

        <div class="quick-actions" id="quick-actions">
            <!-- Quick action buttons will be added dynamically -->
        </div>

        <div class="chat-input-container">
            <input 
                type="text" 
                id="chat-input" 
                class="chat-input" 
                placeholder="Schreiben Sie Ihre Nachricht..."
                maxlength="500"
            />
            <button class="send-btn" id="send-btn">Senden</button>
            <button class="clear-btn" id="clear-btn" title="Chat leeren">🗑️</button>
        </div>
    </div>

    <script>
        class MultilingualChatClient {
            constructor() {
                this.socket = io();
                this.currentLanguage = 'de';
                this.currentTheme = 'dark'; // Default to dark mode
                this.isConnected = false;
                this.isTyping = false;
                
                this.initializeElements();
                this.initializeTheme();
                this.setupSocketListeners();
                this.setupEventListeners();
                this.setupQuickActions();
            }

            initializeElements() {
                this.messagesContainer = document.getElementById('chat-messages');
                this.chatInput = document.getElementById('chat-input');
                this.sendBtn = document.getElementById('send-btn');
                this.clearBtn = document.getElementById('clear-btn');
                this.typingIndicator = document.getElementById('typing-indicator');
                this.statusText = document.getElementById('status-text');
                this.chatTitle = document.getElementById('chat-title');
                this.chatSubtitle = document.getElementById('chat-subtitle');
                this.typingText = document.getElementById('typing-text');
                this.quickActions = document.getElementById('quick-actions');
                this.themeToggle = document.getElementById('theme-toggle');
            }

            initializeTheme() {
                // Load theme from localStorage or default to dark
                const savedTheme = localStorage.getItem('chatbot-theme') || 'dark';
                this.setTheme(savedTheme);
            }

            setTheme(theme) {
                this.currentTheme = theme;
                document.body.setAttribute('data-theme', theme);
                localStorage.setItem('chatbot-theme', theme);
                
                // Update theme toggle icon
                this.themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                this.themeToggle.title = theme === 'dark' ? 
                    (this.currentLanguage === 'de' ? 'Hell-Modus aktivieren' : 'Activate light mode') :
                    (this.currentLanguage === 'de' ? 'Dunkel-Modus aktivieren' : 'Activate dark mode');
            }

            toggleTheme() {
                const newTheme = this.currentTheme === 'dark' ? 'light' : 'dark';
                this.setTheme(newTheme);
            }

            setupSocketListeners() {
                this.socket.on('connect', () => {
                    console.log('Connected to server');
                    this.isConnected = true;
                    this.updateStatus('online');
                    this.socket.emit('user-join', { 
                        name: 'User', 
                        language: this.currentLanguage 
                    });
                });

                this.socket.on('disconnect', () => {
                    console.log('Disconnected from server');
                    this.isConnected = false;
                    this.updateStatus('offline');
                });

                this.socket.on('bot-message', (data) => {
                    this.hideTyping();
                    
                    // Handle rate limit messages differently
                    if (data.type === 'rate-limit') {
                        this.addMessage('system', data.message, data.language);
                        this.chatInput.disabled = true;
                        this.sendBtn.disabled = true;
                        
                        // Re-enable after reset time
                        const now = Date.now();
                        const waitTime = Math.max(1000, data.resetTime - now);
                        setTimeout(() => {
                            this.chatInput.disabled = false;
                            this.sendBtn.disabled = false;
                            this.chatInput.placeholder = this.currentLanguage === 'de' ? 
                                'Schreiben Sie Ihre Nachricht...' : 'Type your message...';
                        }, waitTime);
                        
                        this.chatInput.placeholder = this.currentLanguage === 'de' ? 
                            'Zu viele Nachrichten - bitte warten...' : 'Too many messages - please wait...';
                    } else {
                        this.addMessage('bot', data.message, data.language);
                    }
                    
                    if (data.language && data.language !== this.currentLanguage) {
                        this.currentLanguage = data.language;
                        this.updateLanguageUI();
                    }
                });

                this.socket.on('chat-cleared', (data) => {
                    this.clearMessages();
                    this.addMessage('system', data.message, data.language);
                });

                this.socket.on('join-confirmed', (data) => {
                    console.log('Join confirmed:', data);
                });

                this.socket.on('language-switch-error', (data) => {
                    console.error('Language switch error:', data);
                });
            }

            setupEventListeners() {
                // Send message
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.sendMessage();
                });

                // Clear chat
                this.clearBtn.addEventListener('click', () => this.clearChat());

                // Theme toggle
                this.themeToggle.addEventListener('click', () => this.toggleTheme());

                // Language switching
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const lang = e.target.dataset.lang;
                        this.switchLanguage(lang);
                    });
                });

                // Typing indicator
                let typingTimer;
                this.chatInput.addEventListener('input', () => {
                    if (!this.isTyping) {
                        this.isTyping = true;
                        this.socket.emit('typing', { typing: true });
                    }
                    
                    clearTimeout(typingTimer);
                    typingTimer = setTimeout(() => {
                        this.isTyping = false;
                        this.socket.emit('typing', { typing: false });
                    }, 1000);
                });
            }

            setupQuickActions() {
                const quickActionsData = {
                    'de': [
                        { text: '📝 Bewerbung schreiben', message: 'Wie schreibe ich eine gute Bewerbung?' },
                        { text: '📄 Lebenslauf optimieren', message: 'Hilfe bei meinem Lebenslauf' },
                        { text: '💼 Vorstellungsgespräch', message: 'Tipps für Vorstellungsgespräche' },
                        { text: '💰 Gehaltsverhandlung', message: 'Wie verhandle ich mein Gehalt?' },
                        { text: '🎯 Karriereplanung', message: 'Hilfe bei der Karriereplanung' }
                    ],
                    'en': [
                        { text: '📝 Write Application', message: 'How do I write a good application?' },
                        { text: '📄 Optimize Resume', message: 'Help with my resume' },
                        { text: '💼 Job Interview', message: 'Tips for job interviews' },
                        { text: '💰 Salary Negotiation', message: 'How do I negotiate my salary?' },
                        { text: '🎯 Career Planning', message: 'Help with career planning' }
                    ]
                };

                this.updateQuickActions(quickActionsData[this.currentLanguage]);
            }

            updateQuickActions(actions) {
                this.quickActions.innerHTML = '';
                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = 'quick-action-btn';
                    btn.textContent = action.text;
                    btn.addEventListener('click', () => {
                        this.chatInput.value = action.message;
                        this.sendMessage();
                    });
                    this.quickActions.appendChild(btn);
                });
            }

            switchLanguage(language) {
                if (language === this.currentLanguage) return;

                this.currentLanguage = language;
                this.socket.emit('switch-language', { language });
                this.updateLanguageUI();
                this.setupQuickActions();
            }

            updateLanguageUI() {
                // Update language buttons
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === this.currentLanguage);
                });

                // Update UI text
                const uiText = {
                    'de': {
                        title: 'EasyJobAI Karriere-Assistent',
                        subtitle: 'Ihr intelligenter Begleiter für Bewerbungen und Karriereplanung',
                        placeholder: 'Schreiben Sie Ihre Nachricht...',
                        sendBtn: 'Senden',
                        typing: 'Bot schreibt',
                        online: 'Online',
                        offline: 'Offline',
                        themeToggleDark: 'Hell-Modus aktivieren',
                        themeToggleLight: 'Dunkel-Modus aktivieren'
                    },
                    'en': {
                        title: 'EasyJobAI Career Assistant',
                        subtitle: 'Your intelligent companion for applications and career planning',
                        placeholder: 'Type your message...',
                        sendBtn: 'Send',
                        typing: 'Bot is typing',
                        online: 'Online',
                        offline: 'Offline',
                        themeToggleDark: 'Activate light mode',
                        themeToggleLight: 'Activate dark mode'
                    }
                };

                const text = uiText[this.currentLanguage];
                this.chatTitle.innerHTML = `<span class="brand-name">EasyJobAI</span> ${text.title.replace('EasyJobAI ', '')}`;
                this.chatSubtitle.textContent = text.subtitle;
                this.chatInput.placeholder = text.placeholder;
                this.sendBtn.textContent = text.sendBtn;
                this.typingText.textContent = text.typing;
                
                // Update theme toggle title
                this.themeToggle.title = this.currentTheme === 'dark' ? 
                    text.themeToggleDark : text.themeToggleLight;
                
                if (this.isConnected) {
                    this.statusText.textContent = text.online;
                } else {
                    this.statusText.textContent = text.offline;
                }
            }

            sendMessage() {
                const message = this.chatInput.value.trim();
                if (!message || !this.isConnected) return;

                this.addMessage('user', message, this.currentLanguage);
                this.socket.emit('user-message', { message });
                this.chatInput.value = '';
                this.showTyping();
            }

            addMessage(sender, message, language) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const languageIndicator = language ? `<span class="language-indicator">${language.toUpperCase()}</span>` : '';
                
                messageDiv.innerHTML = `
                    <div class="message-content">
                        ${message.replace(/\n/g, '<br>')}
                        <div class="message-time">${timeStr}${languageIndicator}</div>
                    </div>
                `;

                this.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
            }

            clearMessages() {
                const messages = this.messagesContainer.querySelectorAll('.message');
                messages.forEach(msg => msg.remove());
            }

            clearChat() {
                this.socket.emit('clear-chat');
            }

            showTyping() {
                this.typingIndicator.style.display = 'flex';
                this.scrollToBottom();
            }

            hideTyping() {
                this.typingIndicator.style.display = 'none';
            }

            updateStatus(status) {
                const statusDot = document.querySelector('.status-dot');
                const text = {
                    'de': { online: 'Online', offline: 'Offline' },
                    'en': { online: 'Online', offline: 'Offline' }
                };

                if (status === 'online') {
                    statusDot.style.background = 'var(--status-online)';
                    this.statusText.textContent = text[this.currentLanguage].online;
                } else {
                    statusDot.style.background = 'var(--status-offline)';
                    this.statusText.textContent = text[this.currentLanguage].offline;
                }
            }

            scrollToBottom() {
                setTimeout(() => {
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                }, 100);
            }
        }

        // Initialize the multilingual chat client
        document.addEventListener('DOMContentLoaded', () => {
            new MultilingualChatClient();
        });
    </script>
</body>
</html>
